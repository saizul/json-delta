name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Run the examples against the build
        run: |
          node examples/basic.mjs
          node examples/commonjs.cjs
          node examples/optimistic-update.mjs
      - name: Smoke-test the CLI
        shell: bash
        run: |
          node dist/esm/cli.js --version
          node dist/esm/cli.js examples/before.json examples/before.json
          if node dist/esm/cli.js examples/before.json examples/after.json -k id; then echo "expected exit code 1" && exit 1; fi
          node dist/esm/cli.js examples/before.json examples/after.json -k id --patch > patch.json || true
          node dist/esm/cli.js apply examples/before.json patch.json > applied.json
          node dist/esm/cli.js applied.json examples/after.json
          cat examples/after.json | node dist/esm/cli.js examples/after.json - --summary
      - name: Check the packed package
        run: npm pack --dry-run
